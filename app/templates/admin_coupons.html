{% extends "base.html" %}{% block content %}<div class="section-head"><h1>کدهای تخفیف</h1></div><form class="card form-grid" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="code" placeholder="کد مثل NIYAZ10" required><select name="discount_type"><option value="percent">درصدی</option><option value="fixed">مبلغ ثابت</option></select><input name="value" type="number" placeholder="مقدار"><input name="min_total" type="number" placeholder="حداقل خرید"><input name="max_discount" type="number" placeholder="سقف تخفیف"><input name="usage_limit" type="number" placeholder="سقف استفاده؛ 0 نامحدود"><label class="check"><input type="checkbox" name="active" checked> فعال</label><button class="btn">ایجاد کد</button></form><div class="admin-list">{% for c in coupons %}<div class="card list-row"><div><b>{{c.code}}</b><small>{{c.value}}{{'٪' if c.discount_type=='percent' else ' تومان'}} · استفاده {{c.used_count}} / {{c.usage_limit or '∞'}}</small></div><span class="status {{'completed' if c.active else 'cancelled'}}">{{'فعال' if c.active else 'غیرفعال'}}</span></div>{% endfor %}</div>{% endblock %}
