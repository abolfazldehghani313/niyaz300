{% extends "base.html" %}{% block content %}<div class="section-head"><h1>دسته‌بندی‌ها</h1></div><form class="card inline-form" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="name" placeholder="نام دسته‌بندی جدید" required><button class="btn">افزودن</button></form><div class="admin-list">{% for c in categories %}<div class="card list-row"><div><b>{{c.name}}</b><small>{{c.products|length}} محصول · {{'فعال' if c.is_active else 'غیرفعال'}}</small></div><form method="post" action="{{url_for('main.category_delete',category_id=c.id)}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="danger-btn small">حذف</button></form></div>{% endfor %}</div>{% endblock %}
