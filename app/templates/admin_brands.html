{% extends "base.html" %}{% block content %}<div class="section-head"><h1>برندها</h1></div><form class="card inline-form" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="name" placeholder="نام برند جدید" required><button class="btn">افزودن</button></form><div class="admin-list">{% for b in brands %}<div class="card list-row"><div><b>{{b.name}}</b><small>{{b.products|length}} محصول · {{'فعال' if b.is_active else 'غیرفعال'}}</small></div><form method="post" action="{{url_for('main.brand_delete',brand_id=b.id)}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="danger-btn small">حذف</button></form></div>{% endfor %}</div>{% endblock %}
