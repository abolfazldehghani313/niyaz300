{% extends "base.html" %}{% block content %}<h1>مدیریت نظرات</h1><div class="admin-list">{% for r in reviews %}<article class="card review-admin"><div><b>{{r.product.name}}</b><small>{{r.user.full_name or r.user.username}} · {{r.created_at.strftime('%Y/%m/%d')}}</small><div class="stars">{% for i in range(r.rating) %}★{% endfor %}</div><p>{{r.comment}}</p></div><form method="post" action="{{url_for('main.admin_review_status',review_id=r.id)}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><select name="status"><option value="pending" {% if r.status=='pending' %}selected{% endif %}>در انتظار</option><option value="approved" {% if r.status=='approved' %}selected{% endif %}>تأیید</option><option value="rejected" {% if r.status=='rejected' %}selected{% endif %}>رد</option></select><button class="small">ذخیره</button></form></article>{% else %}<div class="card empty">نظری وجود ندارد.</div>{% endfor %}</div>{% endblock %}
